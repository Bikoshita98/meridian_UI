<div class="flex flex-col gap-2xs">
  @if (label) {
    <mr-label [for]="triggerId" [required]="required" [disabled]="disabled">{{ label }}</mr-label>
  }

  <button
    #trigger
    #origin="cdkOverlayOrigin"
    cdkOverlayOrigin
    type="button"
    [id]="triggerId"
    [class]="triggerClass()"
    [disabled]="disabled"
    [attr.aria-haspopup]="'listbox'"
    [attr.aria-expanded]="isOpen()"
    [attr.aria-describedby]="helperText ? helperId : null"
    (click)="toggle()"
    (keydown.escape)="close()"
  >
    <span [class]="valueClass()">{{ selectedOption()?.label ?? placeholder }}</span>
    <mr-icon name="chevronDown" size="sm" class="shrink-0" [class.rotate-180]="isOpen()" />
  </button>

  <ng-template
    cdkConnectedOverlay
    [cdkConnectedOverlayOrigin]="origin"
    [cdkConnectedOverlayOpen]="isOpen()"
    [cdkConnectedOverlayWidth]="triggerWidth()"
    [cdkConnectedOverlayHasBackdrop]="true"
    cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
    (backdropClick)="close()"
    (detach)="close()"
  >
    <ul [class]="panelClass()" role="listbox">
      @for (option of options; track option.value) {
        <li
          role="option"
          [class]="optionClass(option)"
          [attr.aria-selected]="option.value === value()"
          [attr.aria-disabled]="option.disabled ? 'true' : null"
          (click)="selectOption(option)"
        >
          {{ option.label }}
        </li>
      }
    </ul>
  </ng-template>

  @if (helperText) {
    <span [id]="helperId" [class]="helperClass()">{{ helperText }}</span>
  }
</div>
